<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b3d"/>
      <stop offset="1" stop-color="#0a2f4f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#40c86f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#7fb8ff" stroke-width="4">
    <line x1="160" y1="368" x2="864" y2="368"/>
    <line x1="160" y1="512" x2="864" y2="512"/>
    <line x1="160" y1="656" x2="864" y2="656"/>
  </g>
  <polyline points="176,512 340,512 420,332 520,692 600,432 664,512 848,512"
            fill="none" stroke="url(#pulse)" stroke-width="46"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="176" cy="512" r="28" fill="#4da3ff"/>
  <circle cx="848" cy="512" r="28" fill="#40c86f"/>
</svg>
